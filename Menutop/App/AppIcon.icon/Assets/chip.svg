<?xml version="1.0" encoding="UTF-8"?>
<!-- The Menutop app icon, back layer: a chip outline with three pins on each side. The core is
     the front layer, core.svg; the background is the fill in icon.json. 1024-unit icon grid. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <g stroke="#ebe8e3" stroke-width="34" stroke-linecap="round">
    <line x1="412" y1="250" x2="412" y2="310"/>
    <line x1="512" y1="250" x2="512" y2="310"/>
    <line x1="612" y1="250" x2="612" y2="310"/>
    <line x1="412" y1="714" x2="412" y2="774"/>
    <line x1="512" y1="714" x2="512" y2="774"/>
    <line x1="612" y1="714" x2="612" y2="774"/>
    <line x1="250" y1="412" x2="310" y2="412"/>
    <line x1="250" y1="512" x2="310" y2="512"/>
    <line x1="250" y1="612" x2="310" y2="612"/>
    <line x1="714" y1="412" x2="774" y2="412"/>
    <line x1="714" y1="512" x2="774" y2="512"/>
    <line x1="714" y1="612" x2="774" y2="612"/>
  </g>
  <rect x="310" y="310" width="404" height="404" rx="70" fill="#252321" stroke="#ebe8e3" stroke-width="34"/>
</svg>
